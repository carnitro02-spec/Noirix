name: Import NOIRIX wallpapers

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/NOIRIX_IMPORT_READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download uploaded wallpaper archive
        env:
          ASSET_URL: https://github.com/carnitro02-spec/Noirix/releases/download/wallpaper-import/iamegs.zip
        run: |
          curl -fL --retry 3 "$ASSET_URL" -o /tmp/noirix-wallpapers.zip
          unzip -l /tmp/noirix-wallpapers.zip | head -40

      - name: Import using the original approved wallpaper names
        run: |
          python3 - <<'PY'
          import json, zipfile, pathlib, shutil, collections
          archive = '/tmp/noirix-wallpapers.zip'
          root = pathlib.Path('.')
          catalogue = root / 'wallpapers.json'
          manifest_path = root / 'wallpaper-import-manifest.json'
          records = json.loads(catalogue.read_text(encoding='utf-8'))
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))

          existing_ids = {int(x['id']) for x in records if str(x.get('id', '')).isdigit()}
          existing_images = {str(x.get('image', '')).lower() for x in records}
          source_names = [str(x['source_file']) for x in manifest]
          if len(source_names) != len(set(n.lower() for n in source_names)):
              raise SystemExit('Manifest contains duplicate source filenames.')
          if any(int(x['id']) in existing_ids for x in manifest):
              raise SystemExit('Manifest IDs already exist in wallpapers.json; refusing to overwrite.')

          allowed = {'.jpg', '.jpeg', '.png', '.webp', '.avif'}
          with zipfile.ZipFile(archive) as z:
              image_infos = [
                  info for info in z.infolist()
                  if not info.is_dir() and pathlib.PurePosixPath(info.filename).suffix.lower() in allowed
              ]
              by_basename = collections.defaultdict(list)
              for info in image_infos:
                  by_basename[pathlib.PurePosixPath(info.filename).name].append(info)

              missing = [name for name in source_names if len(by_basename.get(name, [])) == 0]
              ambiguous = [name for name in source_names if len(by_basename.get(name, [])) > 1]
              if missing or ambiguous:
                  print('Missing manifest files:', missing)
                  print('Ambiguous manifest files:', ambiguous)
                  raise SystemExit(f'Archive verification failed: {len(missing)} missing, {len(ambiguous)} ambiguous.')

              imported = []
              for item in manifest:
                  source = by_basename[item['source_file']][0]
                  rel = pathlib.PurePosixPath(item['image'])
                  if rel.is_absolute() or '..' in rel.parts:
                      raise SystemExit(f'Unsafe output path in manifest: {item["image"]}')
                  if str(item['image']).lower() in existing_images:
                      raise SystemExit(f'Image path already exists in catalogue: {item["image"]}')
                  target = root.joinpath(*rel.parts)
                  if target.exists():
                      raise SystemExit(f'Image file already exists; refusing to overwrite: {target}')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(source) as src, target.open('wb') as dst:
                      shutil.copyfileobj(src, dst)
                  imported.append({
                      'id': int(item['id']),
                      'title': item['title'],
                      'category': item['category'],
                      'image': item['image']
                  })

          records.extend(imported)
          catalogue.write_text(json.dumps(records, ensure_ascii=False, indent=2) + '\\n', encoding='utf-8')
          print(f'Imported {len(imported)} wallpapers with approved titles/categories.')
          print('Category totals:', dict(collections.Counter(x['category'] for x in imported)))
          print(f'Catalogue now has {len(records)} entries.')
          PY

      - name: Commit imported wallpapers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nothing to commit"; exit 1; }
          git commit -m "Import approved NOIRIX wallpaper collection"
          git push
