name: Optimize NOIRIX wallpaper images

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/NOIRIX_OPTIMIZE_READY'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install image optimizer
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Convert catalogue images to optimized WebP
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image, ImageOps

          catalogue = Path("wallpapers.json")
          records = json.loads(catalogue.read_text(encoding="utf-8"))
          if not isinstance(records, list) or len(records) != 192:
              raise SystemExit(f"Expected 192 wallpapers; found {len(records) if isinstance(records, list) else 'invalid catalogue'}")

          converted = 0
          before = 0
          after = 0
          old_paths = []

          for item in records:
              source = Path(item["image"])
              if not source.is_file():
                  raise SystemExit(f"Missing source image: {source}")

              before += source.stat().st_size
              target = source.with_suffix(".webp")

              with Image.open(source) as original:
                  image = ImageOps.exif_transpose(original)
                  if image.mode not in ("RGB", "RGBA"):
                      image = image.convert("RGBA" if "A" in image.getbands() else "RGB")
                  image.thumbnail((1440, 2560), Image.Resampling.LANCZOS)
                  image.save(target, "WEBP", quality=82, method=6)

              if not target.is_file() or target.stat().st_size == 0:
                  raise SystemExit(f"WebP conversion failed: {target}")

              after += target.stat().st_size
              item["image"] = target.as_posix()
              old_paths.append(source)
              converted += 1

          # Verify every output can be opened before deleting any originals.
          for item in records:
              with Image.open(item["image"]) as check:
                  check.verify()

          for old in old_paths:
              new = old.with_suffix(".webp")
              if old != new and old.exists():
                  old.unlink()

          catalogue.write_text(json.dumps(records, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          print(f"Optimized {converted} wallpapers.")
          print(f"Original image bytes: {before:,}")
          print(f"Optimized image bytes: {after:,}")
          print(f"Saved: {before-after:,} bytes ({(1-after/before)*100:.1f}%)")
          PY

      - name: Commit optimized images and catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nothing to optimize"; exit 1; }
          git commit -m "Optimize NOIRIX wallpaper images to WebP"
          git push
