name: Inspect existing NOIRIX Dark wallpapers
on:
  push:
    paths:
      - '.github/NOIRIX_DARK_INSPECT_READY'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Dark category contact sheet
        run: |
          python3 -m pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          import math
          files=sorted(Path('dark').glob('*'))
          files=[p for p in files if p.suffix.lower() in ('.jpg','.jpeg','.png','.webp')]
          w,h=220,340; cols=5; rows=math.ceil(len(files)/cols)
          sheet=Image.new('RGB',(w*cols,h*rows),'white'); d=ImageDraw.Draw(sheet)
          for i,p in enumerate(files):
            try:
              im=Image.open(p).convert('RGB'); im.thumbnail((w-12,h-55))
              x=(i%cols)*w+(w-im.width)//2; y=(i//cols)*h+4
              sheet.paste(im,(x,y))
              d.text(((i%cols)*w+5,(i//cols)*h+h-45),p.name[:30],fill='black')
            except Exception as e:
              d.text(((i%cols)*w+5,(i//cols)*h+8),str(e)[:30],fill='red')
          Path('/tmp/dark-sheet').mkdir(exist_ok=True)
          sheet.save('/tmp/dark-sheet/dark-contact.jpg',quality=90)
          (Path('/tmp/dark-sheet')/'files.txt').write_text('\n'.join(str(p) for p in files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: noirix-dark-inspection
          path: /tmp/dark-sheet/
          retention-days: 2
